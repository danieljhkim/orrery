[project]
name = "orrery"
version = "0.1.0"
description = "Accumulated physics sims — shared Python helpers for the Monte Carlo / numerics lane"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2",
    "matplotlib>=3.8",
    "pyarrow>=20",
    "scipy>=1.14",
    "sympy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lab/lib/py/orrery"]
